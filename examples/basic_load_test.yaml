name: Basic Load Test

stages:
  - duration: 30s
    target_vus: 5
  - duration: 1m
    target_vus: 10
  - duration: 30s
    target_vus: 5

http:
  base_url: "http://httpbin:8080"
  timeout: 10s
  requests:
    - method: GET
      path: /get
      assertions:
        - status_code: 200
        - response_time_p99_ms: 1000
    - method: GET
      path: /status/200
      think_time: 100ms
      assertions:
        - status_code: 200
        - response_time_p95_ms: 1000

variables:
  api_key: "${API_KEY}"
