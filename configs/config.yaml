orchestrator:
  address: "0.0.0.0"
  port: 50051
  metrics_port: 9090
  worker_timeout: "30s"
  health_check_interval: "5s"

worker:
  address: "0.0.0.0"
  port: 50052
  max_vus: 1000
  orchestrator_url: "localhost:50051"
  heartbeat_interval: "10s"

cli:
  orchestrator_url: "localhost:50051"
  refresh_interval: "1s"

etcd:
  endpoints:
    - "localhost:2379"
  dial_timeout: "5s"
  prefix: "/gosentinel"

tracing:
  enabled: false
  endpoint: "localhost:4317"
  service_name: "gosentinel"
  environment: "development"

logging:
  level: "info"
  development: false
