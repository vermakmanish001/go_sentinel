services:
  etcd:
    image: quay.io/coreos/etcd:v3.5.11
    container_name: gosentinel-etcd
    environment:
      - ETCD_NAME=etcd
      - ETCD_DATA_DIR=/etcd-data
      - ETCD_LISTEN_CLIENT_URLS=http://0.0.0.0:2379
      - ETCD_ADVERTISE_CLIENT_URLS=http://etcd:2379
    ports:
      - "2379:2379"
    volumes:
      - etcd-data:/etcd-data
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 10s
      timeout: 5s
      retries: 5

  orchestrator:
    build:
      context: ..
      dockerfile: docker/orchestrator.Dockerfile
    container_name: gosentinel-orchestrator
    environment:
      - GOSENTINEL_ORCHESTRATOR_ADDRESS=0.0.0.0
      - GOSENTINEL_ORCHESTRATOR_PORT=50051
      - GOSENTINEL_ETCD_ENDPOINTS=etcd:2379
      - GOSENTINEL_TRACING_ENABLED=true
      - GOSENTINEL_TRACING_ENDPOINT=jaeger:4317
    ports:
      - "50051:50051"
      - "9090:9090"
    depends_on:
      etcd:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "grpc_health_probe", "-addr=:50051"]
      interval: 10s
      timeout: 5s
      retries: 5

  worker:
    build:
      context: ..
      dockerfile: docker/worker.Dockerfile
    # Allow multiple worker containers without name conflicts
    environment:
      - GOSENTINEL_WORKER_ADDRESS=0.0.0.0
      - GOSENTINEL_WORKER_PORT=50052
      - GOSENTINEL_WORKER_ORCHESTRATOR_URL=orchestrator:50051
      - GOSENTINEL_WORKER_MAX_VUS=1000
      - GOSENTINEL_TRACING_ENABLED=true
      - GOSENTINEL_TRACING_ENDPOINT=jaeger:4317
      - GOSENTINEL_LOGGING_LEVEL=debug
    ports:
      - "50052-50054:50052"
    depends_on:
      - orchestrator
    deploy:
      replicas: 3
    healthcheck:
      test: ["CMD", "grpc_health_probe", "-addr=:50052"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ..
      dockerfile: docker/api.Dockerfile
    container_name: gosentinel-api
    environment:
      - GOSENTINEL_API_ADDRESS=0.0.0.0
      - GOSENTINEL_API_PORT=8090
      - GOSENTINEL_API_ORCHESTRATOR_URL=orchestrator:50051
      - GOSENTINEL_LOGGING_LEVEL=info
    ports:
      - "8090:8090"
    depends_on:
      - orchestrator
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8090/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  httpbin:
    image: mccutchen/go-httpbin
    container_name: gosentinel-httpbin
    ports:
      - "8080:8080"

  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: gosentinel-jaeger
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    ports:
      - "16686:16686"  # Jaeger UI
      - "4317:4317"    # OTLP gRPC
      - "4318:4318"    # OTLP HTTP
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:16686"]
      interval: 10s
      timeout: 5s
      retries: 5

  prometheus:
    image: prom/prometheus:latest
    container_name: gosentinel-prometheus
    volumes:
      - ../configs/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    ports:
      - "9091:9090"
    depends_on:
      - orchestrator
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9090/-/healthy"]
      interval: 10s
      timeout: 5s
      retries: 5

  grafana:
    image: grafana/grafana:latest
    container_name: gosentinel-grafana
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana-data:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  etcd-data:
  prometheus-data:
  grafana-data:

networks:
  default:
    name: gosentinel-network
